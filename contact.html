<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Lente Silvestre</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; color: #333;">

    <nav style="background-color: #2c3e50; padding: 15px; border-radius: 5px; text-align: center;">
        <a href="index.html" style="color: #ffffff; text-decoration: none; margin: 0 15px;">Inicio</a>
        <a href="about.html" style="color: #ffffff; text-decoration: none; margin: 0 15px;">Sobre Nosotros</a>
        <a href="contact.html" style="color: #ffffff; text-decoration: none; font-weight: bold; margin: 0 15px;">Contacto</a>
    </nav>

    <main style="max-width: 800px; margin: 30px auto; background-color: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h1 style="color: #2e7d32; border-bottom: 2px solid #2e7d32; padding-bottom: 10px;">Ponte en Contacto</h1>
        <p style="line-height: 1.6;">¿Tienes alguna pregunta sobre nuestros proyectos o quieres contratar un taller? Envíanos un mensaje:</p>

        <form style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Nombre:</label>
                <input type="text" placeholder="Tu nombre" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Correo Electrónico:</label>
                <input type="email" placeholder="tu@email.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Mensaje:</label>
                <textarea rows="4" placeholder="Escribe tu mensaje aquí..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"></textarea>
            </div>

            <button type="button" style="background-color: #2e7d32; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%;">Enviar Mensaje</button>
        </form>
    </main>

</body>
</html>
